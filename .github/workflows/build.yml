name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --no-restore --logger trx --results-directory TestResults/unit
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet run --project src/AiNative.Headless --no-build
      - name: Phase 2 CLI acceptance
        run: python3 scripts/verify_phase2.py --output TestResults/phase-2
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 7
